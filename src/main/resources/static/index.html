<!DOCTYPE html>
<html lang="en">
<head>
    <title>Cloud Calculator</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background: #f4f4f9; }
        .calc-box { background: white; padding: 20px; display: inline-block; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        input, button { padding: 10px; margin: 5px; font-size: 16px; border-radius: 4px; border: 1px solid #ccc; }
        button { background: #007bff; color: white; cursor: pointer; border: none; }
        h2 { color: #333; }
    </style>
</head>
<body>
    <div class="calc-box">
        <h2>Cloud Calculator</h2>
        <input type="number" id="num1" placeholder="Num 1">
        <input type="number" id="num2" placeholder="Num 2">
        <button onclick="calculate()">Add Numbers</button>
        <h3 id="output">Result will show here</h3>
    </div>

    <script>
        async function calculate() {
            const a = document.getElementById('num1').value;
            const b = document.getElementById('num2').value;
            
            // This calls your live Java backend api dynamically!
            const response = await fetch(`/api/calculator/add?a=${a}&b=${b}`);
            const data = await response.json();
            
            document.getElementById('output').innerText = `Result: ${data.result} (${data.operation})`;
        }
    </script>
</body>
</html>
